server {
    listen 80;
    server_name localhost;

    # Nginx will serve files from this directory
    root /usr/share/nginx/html;
    index index.html;

    # Crucial for Angular SPA routing:
    # If the requested file or directory doesn't exist, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets like images, js, css for better performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
