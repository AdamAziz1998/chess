<main class="min-h-screen w-full bg-neutral-950 text-gray-200 flex flex-col font-sans">
  <div class="flex flex-row flex-grow gap-8 w-full">
    <div class="w-2/3 flex flex-col items-center py-4">
      <header class="mb-6 w-full md:w-3/4 px-10">
        <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-white">Chess Practice and Explorer</h1>
        <p class="text-gray-400 mt-2">Explore historical moves or play against a friend or AI.</p>
      </header>

      <div class="w-full md:w-3/4 flex justify-center items-center">
        <div id="myBoard" (click)="onBoardClick()" class="w-full aspect-square shadow-2xl mx-10"></div>

        @if (showPromotionModal()) {
          <app-promotion-modal
            [color]="promotionPendingMove()?.color || 'w'"
            (onPromote)="promoteTo($event)"
            (onCancel)="cancelPromotion()">
          </app-promotion-modal>
        }
      </div>
    </div>

    <app-sidebar
      class="md:w-1/3"
      [gameMode]="gameMode()"
      [playMode]="playMode()"
      [gameStatus]="gameStatus()"
      [historicalMoves]="historicalMoves()"
      [capturedPieces]="capturedPieces()"
      (gameModeChange)="setGameMode($event)"
      (playModeChange)="setPlayMode($event)"
      (historicalMoveClicked)="onHistoricalMoveClick($event)"
      (flipBoardClicked)="flipBoard()"
      (resetGameClicked)="resetGame()"
      (fenPositionEntered)="updateBoardFromFen($event)">
    </app-sidebar>
  </div>
</main>
